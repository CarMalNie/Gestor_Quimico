{% extends "base.html" %}

{% block title %}Contraseña Actualizada{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h1 class="mb-4">✅ Contraseña actualizada</h1>

        <div class="card shadow">
            <div class="card-body">
                <p class="mb-3">
                    Tu contraseña se cambió correctamente. Ya puedes iniciar sesión con
                    tus nuevas credenciales.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100">
                    Iniciar sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
